<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sizwe Ndhlozi - Links | V1.2</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Space+Grotesk:wght@400&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Space Grotesk', sans-serif; }
.retro {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    letter-spacing: -0.02em;
    transform: rotate(-1deg);
  }
.glass {
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(0,0,0,0.06);
  }
.glass:hover { background: rgba(255,255,255,1); transform: scale(1.02); }
.bg-slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.8s ease-in-out;
  }
.bg-slide.active { opacity: 1; }
.page-wrap { transform: scale(0.88); transform-origin: center top; }
  @media (max-height: 800px) {.page-wrap { transform: scale(0.82); } }
.bouncy { animation: bouncyProfile 3s ease-in-out infinite; }
  @keyframes bouncyProfile {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-6px) scale(1.02); }
    50% { transform: translateY(0) scale(1); }
    75% { transform: translateY(-3px) scale(1.01); }
  }
  /* V1.2 - icon richness */
 .icon-btn { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
 .icon-btn svg { shape-rendering: geometricPrecision; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-black relative overflow-hidden">

<script>
  const slides = [
    "https://picsum.photos/seed/capetown/1080/1920",
    "https://picsum.photos/seed/driving/1080/1920",

    "https://picsum.photos/seed/data/1080/1920",
    "https://picsum.photos/seed/city/1080/1920"
  ];
  const quotes = [
    "It's a Gen 5 & that bitch is modified.",
    "Divorced from procrastination.",
    "Huge supporter of WFH.",
    "Liverpool.",
    "It's all relative."
  ];
</script>

<div id="slideshow" class="absolute inset-0 z-0"></div>
<div class="absolute inset-0 bg-black/25 z-1"></div>

<div class="page-wrap relative z-10 w-full max-w-[340px] px-5 py-6 flex flex-col items-center">

  <div class="bouncy w-20 h-20 rounded-full overflow-hidden border-2 border-white shadow-sm mb-4 bg-gray-200">
    <img src="https://picsum.photos/seed/sizwe/200/200" class="w-full h-full object-cover">
  </div>

  <h1 class="retro text-[34px] text-white text-center leading-none drop-shadow-md">Sizwe Ndhlozi</h1>
<p class="text-white/90 text-[11px] mt-2 tracking-[0.15em] uppercase text-center w-full">Sales • Data Handler • Driver • Cape Town</p>

<!-- V1.2 ICONS - HIGH QUALITY STROKE -->
<div class="w-full mt-8 flex justify-center gap-5">
  <!-- Instagram - Lucide style, crisp -->
  <a href="https://www.instagram.com/sizzthesecond/" target="_blank" class="icon-btn w-12 h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center hover:bg-white hover:scale-110 transition-all duration-300 group">
    <svg class="w-[22px] h-[22px] text-white group-hover:text-black transition-colors" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="20" rx="6" ry="6"/>
      <circle cx="12" cy="12" r="4.2"/>
      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
    </svg>
  </a>
  <!-- LinkedIn - crisp stroke -->
  <a href="https://www.linkedin.co.za/dominion/" target="_blank" class="icon-btn w-12 h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center hover:bg-white hover:scale-110 transition-all duration-300 group">
    <svg class="w-[20px] h-[20px] text-white group-hover:text-black transition-colors" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
      <rect x="2" y="9" width="4" height="12"/>
      <circle cx="4" cy="4" r="2"/>
    </svg>
  </a>
  <!-- WhatsApp - crisp stroke -->
  <a href="https://wa.me/27XXXXXXXXX" target="_blank" class="icon-btn w-12 h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center hover:bg-white hover:scale-110 transition-all duration-300 group">
    <svg class="w-[22px] h-[22px] text-white group-hover:text-black transition-colors" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/>
      <path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/>
    </svg>
  </a>
</div>

<div id="dots" class="flex gap-1.5 my-6"></div>

<p id="quoteText" class="text-white text-[13px] italic text-center w-full max-w-[280px] mt-4 leading-relaxed transition-opacity duration-700">"Born and raised to rise — Cape Town is home."</p>

</div>

<script>
  const container = document.getElementById('slideshow');
  const dotsContainer = document.getElementById('dots');
  const quoteEl = document.getElementById('quoteText');
  let current = 0;
  slides.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = `bg-slide ${i===0?'active':''}`;
    div.style.backgroundImage = `url('${src}')`;
    container.appendChild(div);
    const dot = document.createElement('div');
    dot.className = `h-1 rounded-full transition-all ${i===0?'w-6 bg-white':'w-1.5 bg-white/40'}`;
    dotsContainer.appendChild(dot);
  });
  const slideEls = document.querySelectorAll('.bg-slide');
  const dotEls = dotsContainer.children;
  setInterval(() => {
    quoteEl.style.opacity = 0;
    setTimeout(() => {
      slideEls[current].classList.remove('active');
      dotEls[current].className = 'h-1 w-1.5 rounded-full bg-white/40 transition-all';
      current = (current + 1) % slides.length;
      slideEls[current].classList.add('active');
      dotEls[current].className = 'h-1 w-6 rounded-full bg-white transition-all';
      quoteEl.textContent = `"${quotes[current]}"`;
      quoteEl.style.opacity = 1;
    }, 350);
  }, 4000);
</script>
</body>
</html>
