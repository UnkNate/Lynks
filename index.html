<!-- V1.4 - YOUR SLIDES - NO JERK -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sizwe Ndhlozi - V1.4</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Space+Grotesk:wght@400&display=swap" rel="stylesheet">
<style>
  body{font-family:'Space Grotesk',sans-serif;background:#000;margin:0;overflow:hidden}
 .retro{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:-0.02em;transform:rotate(-1deg)}
 .bg-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease-in-out;will-change:opacity}
 .bg-slide.active{opacity:1}
 .page-wrap{width:100%;max-width:340px}
 .bouncy{animation:bouncyProfile 3s ease-in-out infinite}
  @keyframes bouncyProfile{0%,100%{transform:translateY(0)}25%{transform:translateY(-6px) scale(1.02)}50%{transform:translateY(0)}75%{transform:translateY(-3px) scale(1.01)}}
 .icon-btn{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-black relative">
<div id="slideshow" class="absolute inset-0 z-0 bg-black"></div>
<div class="absolute inset-0 bg-black/30 z-10"></div>
<div class="page-wrap relative z-20 w-full max-w-[340px] px-5 py-6 flex flex-col items-center">
  <div class="bouncy w-20 h-20 rounded-full overflow-hidden border-2 border-white shadow-sm mb-4 bg-gray-200">
    <img src="./slide1.jpg" class="w-full h-full object-cover">
  </div>
  <h1 class="retro text-[34px] text-white text-center leading-none drop-shadow-md">Sizwe Ndhlozi</h1>
  <p class="text-white/90 text-[11px] mt-2 tracking-[0.15em] uppercase text-center w-full">Sales • Data Handler • Driver • Cape Town</p>
  <div class="w-full mt-8 flex justify-center gap-5">
    <a href="https://www.instagram.com/sizzthesecond/" class="icon-btn w-12 h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center hover:bg-white group">IG</a>
    <a href="#" class="icon-btn w-12 h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center hover:bg-white group">LI</a>
    <a href="#" class="icon-btn w-12 h-12 rounded-full bg-white/10 border border-white/20 flex items-center justify-center hover:bg-white group">WA</a>
  </div>
  <div id="dots" class="flex gap-1.5 my-6"></div>
  <p id="quoteText" class="text-white text-[13px] italic text-center w-full max-w-[280px] mt-4 leading-relaxed transition-opacity duration-700">"It's a Gen 5 & that bitch is modified."</p>
</div>
<script>
  const slides=["./slide1.jpg","./slide2.jpg","./slide3.jpg","./slide4.jpg","./slide5.jpg"];
  const quotes=["It's a Gen 5 & that bitch is modified.","Patta vibes.","Reserved for legends.","White R on the coast.","MaySomethingSomething - 2016"];
  const container=document.getElementById('slideshow');const dots=document.getElementById('dots');const quoteEl=document.getElementById('quoteText');
  let loaded=0;let current=0;let slideEls,dotEls;
  slides.forEach(src=>{const i=new Image();i.src=src;i.onload=i.onerror=()=>{loaded++;if(loaded===slides.length)init()}});
  setTimeout(()=>{if(!slideEls)init()},3000);
  function init(){if(slideEls)return;slides.forEach((src,i)=>{const d=document.createElement('div');d.className=`bg-slide ${i===0?'active':''}`;d.style.backgroundImage=`url('${src}')`;container.appendChild(d);const dot=document.createElement('div');dot.className=`h-1 rounded-full transition-all ${i===0?'w-6 bg-white':'w-1.5 bg-white/40'}`;dots.appendChild(dot)});slideEls=document.querySelectorAll('.bg-slide');dotEls=dots.children;setInterval(()=>{quoteEl.style.opacity=0;setTimeout(()=>{slideEls[current].classList.remove('active');dotEls[current].className='h-1 w-1.5 rounded-full bg-white/40 transition-all';current=(current+1)%slides.length;slideEls[current].classList.add('active');dotEls[current].className='h-1 w-6 rounded-full bg-white transition-all';quoteEl.textContent=`"${quotes[current]}"`;quoteEl.style.opacity=1},350)},4000)}
</script>
</body>
</html>
